services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: easyway
      POSTGRES_USER: easyway
      POSTGRES_PASSWORD: easyway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyway -d easyway"]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - "1080:1080"  # web UI
      - "1025:1025"  # SMTP

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Routing spike (see project notes): drop a Cameroon .osm.pbf extract into
  # ./valhalla/custom_files/ before first `docker compose up` -- the image's
  # entrypoint builds tiles from any *.osm.pbf found there automatically.
  # Rebuild is skipped once valhalla_tiles.tar exists, unless you flip
  # force_rebuild to True or delete that file.
  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./valhalla/custom_files:/custom_files
    environment:
      - tile_urls=
      - use_tiles_ignore_pbf=False
      - force_rebuild=False
      - build_elevation=False
      - build_admins=True
      - build_time_zones=False
      - build_transit=False
      - server_threads=2
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5m  # first boot builds tiles from the .pbf, can take a while

  # P2b : geocodeur externe (recherche + inverse), fusionne dans
  # /api/lieux/recherche/ et /api/lieux/inverse/ (ClientNominatim, avec repli
  # sur les donnees locales si indisponible). Reutilise le meme .pbf verifie
  # que Valhalla -- pas de retelechargement. Premier import : compter
  # plusieurs dizaines de minutes meme pour un pays de cette taille.
  nominatim:
    image: mediagis/nominatim:4.4
    container_name: nominatim
    restart: unless-stopped
    ports:
      - "8003:8080"
    environment:
      PBF_PATH: /data/cameroon-latest.osm.pbf
      IMPORT_WIKIPEDIA: false
      IMPORT_US_POSTCODES: false
      IMPORT_GB_POSTCODES: false
      IMPORT_TIGER_ADDRESSES: false
      NOMINATIM_PASSWORD: nominatim
      # Import fige (pas de flux de mise a jour continu) : suffisant pour du
      # dev local sur un extrait statique.
      FREEZE: true
    volumes:
      - ./valhalla/custom_files/cameroon-latest.osm.pbf:/data/cameroon-latest.osm.pbf:ro
      - nominatim_data:/var/lib/postgresql/14
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/status.php || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 45m  # premier import du .pbf, pas juste un boot de service

  # P2b : geocodeur de recherche (pas d'inverse -- Nominatim garde ce role).
  # Pas d'image officielle : Dockerfile local qui recupere le jar komoot et
  # importe depuis la base Postgres de Nominatim (nominatim-import), une
  # seule fois -- l'index reconstruit reutilise le volume au redemarrage.
  # Demarre seulement une fois Nominatim importe (attend son healthcheck).
  photon:
    build: ./photon
    container_name: photon
    restart: unless-stopped
    depends_on:
      nominatim:
        condition: service_healthy
    ports:
      - "2322:2322"
    environment:
      NOMINATIM_HOST: nominatim
      NOMINATIM_PORT: 5432
      NOMINATIM_DB: nominatim
      NOMINATIM_USER: nominatim
      NOMINATIM_PASSWORD: nominatim
      PHOTON_LANGUAGES: fr,en
    volumes:
      - photon_data:/photon/photon_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2322/api?q=test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 30m  # nominatim-import avant le premier demarrage du serveur

  # App Django (Dockerfile a la racine). Ne depend au demarrage que de
  # db/redis (migrate, cache, sessions) -- pas de valhalla/nominatim/photon :
  # tout le code qui les appelle degrade deja gracieusement (disjoncteurs,
  # cf. trips/services/disjoncteur.py) quand ils sont indisponibles, les
  # attendre ici bloquerait web potentiellement 45 min (premier import
  # Nominatim) pour rien. Healthcheck : celui deja defini dans le Dockerfile,
  # pas duplique ici.
  web:
    build: .
    container_name: web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Alias reseau internes au reseau docker-compose (nom de service) --
      # pas les URL de .env, ecrites pour un Django qui tourne sur l'hote et
      # rejoint ce reseau par les ports publies, different d'ici ou web est
      # lui-meme un conteneur du reseau.
      DATABASE_URL: postgis://easyway:easyway@db:5432/easyway
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TELEMETRIE_REDIS_URL: redis://redis:6379/3
      VALHALLA_URL: http://valhalla:8002
      NOMINATIM_URL: http://nominatim:8080
      PHOTON_URL: http://photon:2322
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
      - ./valhalla/custom_files:/custom_files:ro

  # Meme image que web (Dockerfile a la racine), commande differente.
  # entrypoint: [] court-circuite docker/entrypoint.sh (migrate/collectstatic) :
  # web s'en charge deja, le refaire ici serait inutile et potentiellement
  # concurrent au demarrage si les deux services migraient en meme temps.
  celery_worker:
    build: .
    container_name: celery_worker
    restart: unless-stopped
    entrypoint: []
    command: celery -A config worker -l info
    # Le HEALTHCHECK du Dockerfile teste curl localhost:8000 (web) -- ce
    # service ne sert jamais de HTTP, echouerait toujours sinon (marque
    # "unhealthy" en permanence sans que rien ne soit reellement casse).
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgis://easyway:easyway@db:5432/easyway
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TELEMETRIE_REDIS_URL: redis://redis:6379/3
      VALHALLA_URL: http://valhalla:8002
      NOMINATIM_URL: http://nominatim:8080
      PHOTON_URL: http://photon:2322

  celery_beat:
    build: .
    container_name: celery_beat
    restart: unless-stopped
    entrypoint: []
    command: celery -A config beat -l info
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgis://easyway:easyway@db:5432/easyway
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      TELEMETRIE_REDIS_URL: redis://redis:6379/3
      VALHALLA_URL: http://valhalla:8002
      NOMINATIM_URL: http://nominatim:8080
      PHOTON_URL: http://photon:2322

volumes:
  postgres_data:
  nominatim_data:
  photon_data:
  static_data:
  media_data:
