services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: easyway
      POSTGRES_USER: easyway
      POSTGRES_PASSWORD: easyway
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easyway -d easyway"]
      interval: 5s
      timeout: 5s
      retries: 10

  maildev:
    image: maildev/maildev
    restart: unless-stopped
    ports:
      - "1080:1080"  # web UI
      - "1025:1025"  # SMTP

volumes:
  postgres_data:
