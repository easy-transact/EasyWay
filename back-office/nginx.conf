server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing (react-router BrowserRouter): any path
    # without a matching static file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so a new deploy is picked up
    # immediately; hashed assets (index-<hash>.js/css) are safe to cache
    # forever since a new build gets new filenames.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
