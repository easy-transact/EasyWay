upstream web_app {
    server web:8000;
}

upstream ws_app {
    server ws:8001;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Timeouts courts pour fermer les scanners lents et connexions inactives
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;
    keepalive_timeout 30s;

    # Buffering actif : protege les workers Gunicorn contre les clients lents
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 8 64k;

    # Fichiers statiques et medias
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # WebSockets (ASGI / Daphne)
    location /ws/ {
        proxy_pass http://ws_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # API HTTP Django (WSGI / Gunicorn)
    location / {
        proxy_pass http://web_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
